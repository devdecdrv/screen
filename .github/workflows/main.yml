name: Build & Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.2)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Generate launcher icons (mipmap)
        run: |
          BASE=dec_remote/android_app/app/src/main/res
          for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p "$BASE/$dir"
          done

          # Generate a simple colored PNG icon using Python + PIL
          python3 - <<'EOF'
          from PIL import Image, ImageDraw
          import os

          sizes = {
              "mipmap-mdpi":    48,
              "mipmap-hdpi":    72,
              "mipmap-xhdpi":   96,
              "mipmap-xxhdpi":  144,
              "mipmap-xxxhdpi": 192,
          }
          base = "dec_remote/android_app/app/src/main/res"
          for folder, size in sizes.items():
              img = Image.new("RGBA", (size, size), (13, 17, 23, 255))
              draw = ImageDraw.Draw(img)
              margin = size // 8
              draw.ellipse([margin, margin, size - margin, size - margin],
                           fill=(88, 166, 255, 255))
              path = os.path.join(base, folder)
              img.save(os.path.join(path, "ic_launcher.png"))
              img.save(os.path.join(path, "ic_launcher_round.png"))
              print(f"Generated {folder}: {size}x{size}")
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x dec_remote/android_app/gradlew

      - name: Build debug APK
        working-directory: dec_remote/android_app
        run: gradle assembleDebug

      - name: Set release tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=v$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "dec Remote ${{ steps.tag.outputs.tag }}"
          body: |
            ✅ Auto-build from push to main
            📱 APK download करो → phone पर install करो
            🔗 App में Worker URL + Bot Token भरो → START
          files: dec_remote/android_app/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
